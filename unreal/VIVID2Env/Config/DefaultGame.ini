[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=VIVID2Env
Description=VIVID 2 - Virtual Validation for AI Drones

[/Script/UnrealEd.ProjectPackagingSettings]
+MapsToCook=(FilePath="/Game/VIVID2/Maps/ForestSAR")
+MapsToCook=(FilePath="/Game/VIVID2/Maps/ForestSAR_Open")
+MapsToCook=(FilePath="/Game/VIVID2/Maps/ForestSAR_Dense")
; Targets and distractors are spawned by name at runtime, so nothing in a map references them.
+DirectoriesToAlwaysCook=(Path="/Game/VIVID2/Targets")
; Fires too (scenario "fires"); their Niagara systems in /Game/VIVID2/FX are cooked as references.
+DirectoriesToAlwaysCook=(Path="/Game/VIVID2/Fire")
; Same for the plugin content Project AirSim loads at runtime: drone meshes, weather/fog actor.
+DirectoriesToAlwaysCook=(Path="/ProjectAirSim")
+DirectoriesToAlwaysCook=(Path="/Drone")
; Stage the Unreal prerequisites installer (VC++ runtime, DirectX) for machines without Unreal.
IncludePrerequisites=True
