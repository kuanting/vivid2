[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[SystemSettings]
; Camera auto-exposure adapts by speed x frame time each time a camera captures, so a packaged game
; running at hundreds of fps adapts many times slower than the editor and images depend on the machine.
; A 30 fps cap bounds the frame time (FrameRateLimit in DefaultGameUserSettings.ini says the same).
t.MaxFPS=30
; Lumen's cached lighting and the real-time sky light are stored for exposures from -12 to +8 around
; this value (default 4: -8..+12). At dusk the cameras sit near -11 (Unreal warns "Cached lighting ...
; is going to be clipped"), so shift the range down to -14..+6, which still covers noon.
r.EyeAdaptation.CachedLightingPreExposure=-2
