; Defaults for packaged VIVID2Env builds. Every machine that runs the benchmark must
; render the same images, so render quality is pinned to Epic (what the editor uses)
; instead of whatever a machine's own settings or hardware would pick.
[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3
sg.LandscapeQuality=3

; A small window, not full screen: the simulator renders its cameras off screen, and
; the window is only for watching. Override with -ResX/-ResY or -RenderOffScreen.
[/Script/Engine.GameUserSettings]
FullscreenMode=2
LastConfirmedFullscreenMode=2
PreferredFullscreenMode=2
ResolutionSizeX=1280
ResolutionSizeY=720
LastUserConfirmedResolutionSizeX=1280
LastUserConfirmedResolutionSizeY=720
bUseVSync=False
bUseDynamicResolution=False
; Same cap as t.MaxFPS in DefaultEngine.ini (camera auto-exposure adapts per rendered frame).
FrameRateLimit=30.000000
